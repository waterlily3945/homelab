apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookrequest-config
  namespace: external
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookrequest
  namespace: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookrequest
  template:
    metadata:
      labels:
        app: audiobookrequest
    spec:
      containers:
        - name: audiobookrequest
          image: markbeep/audiobookrequest:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookrequest-config
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookrequest
  namespace: external
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.5.207  # <-- pick an unused IP in your LAN
spec:
  selector:
    app: audiobookrequest
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
