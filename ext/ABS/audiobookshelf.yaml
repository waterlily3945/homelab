apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: external
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
  namespace: external
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
      containers:
        - name: audiobookshelf
          image: advplyr/audiobookshelf:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            - name: audiobooks
              mountPath: /audiobooks
            - name: podcasts
              mountPath: /podcasts
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: audiobooks
          nfs:
            server: 192.168.0.222
            path: /ABS
        - name: podcasts
          nfs:
            server: 192.168.0.222
            path: /podcasts
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: external
spec:
  type: ClusterIP
  selector:
    app: audiobookshelf
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  namespace: external
  annotations:
    # 1. Cert-Manager ClusterIssuer
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # 2. Force TLS router creation on Traefik
    traefik.ingress.kubernetes.io/router.tls: "true"

    # 3. Bind strictly to public entrypoints (192.168.5.210)
    traefik.ingress.kubernetes.io/router.entrypoints: webpublic,webpublicsecure

    # 4. Route through CrowdSec middleware
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-traefik-bouncer@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: abs.wrightops.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 80
  tls:
    - hosts:
        - abs.wrightops.org
      secretName: audiobookshelf-cert