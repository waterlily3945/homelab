apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: external
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      containers:
        - name: jellyseerr
          image: fallenbagel/jellyseerr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerrr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: external
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.5.203  # <-- pick an unused IP in your LAN
spec:
  selector:
    app: seerr
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 5055
      targetPort: 5055
