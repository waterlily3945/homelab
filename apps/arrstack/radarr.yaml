apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-pvc
  namespace: arrstack
spec:
  accessModes:
    - ReadWriteOnce            
  resources:
    requests:
      storage: 5Gi 
  storageClassName: longhorn 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr            
  namespace: arrstack      
spec:
  replicas: 1        
  selector:
    matchLabels:
      app: radarr         
  template:
    metadata:
      labels:
        app: radarr       
    spec:
      containers:
      - name: radarr      
        image: linuxserver/radarr:latest        
        ports:
        - containerPort: 7878
        volumeMounts:
        - name: radarr-data
          mountPath: /config
        - name: mnt
          mountPath: /mnt
      volumes:
      - name: radarr-data
        persistentVolumeClaim:
          claimName: radarr-pvc
      - name: mnt
        nfs:
            server: 192.168.0.222
            path: /Big_Lad
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: arrstack
spec:
  selector:
    app: radarr
  ports:
  - port: 80
    targetPort: 7878
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-ingress
  namespace: arrstack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: radarr.HOSTNAME.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr
            port:
              number: 80
  tls:
  - hosts:
    - radarr.HOSTNAME.com
    secretName: radarr-cert
