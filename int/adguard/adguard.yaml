apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-config
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-data
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: adguardhome
  namespace: adguard
spec:
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
      - name: adguardhome
        image: adguard/adguardhome:latest
        securityContext:
          runAsUser: 0
        ports:
        - name: dns-udp
          containerPort: 53
          hostPort: 53
          protocol: UDP
        - name: dns-tcp
          containerPort: 53
          hostPort: 53
          protocol: TCP
        - name: web
          containerPort: 3000
          hostPort: 3000
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /opt/adguardhome/conf
        - name: data
          mountPath: /opt/adguardhome/work
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: adguard-config
      - name: data
        persistentVolumeClaim:
          claimName: adguard-data

---
apiVersion: v1
kind: Service
metadata:
  name: adguard-lb
  namespace: adguard
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.5.207
  externalTrafficPolicy: Local
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: web
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: adguardhome