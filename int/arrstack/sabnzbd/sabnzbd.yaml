apiVersion: v1
kind: Namespace
metadata:
  name: arrstack         
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-pvc
  namespace: arrstack 
spec:
  accessModes:
    - ReadWriteOnce            
  resources:
    requests:
      storage: 5gi 
  storageClassName: longhorn 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd            
  namespace: arrstack      
spec:
  replicas: 1       
  selector:
    matchLabels:
      app: sabnzbd         
  template:
    metadata:
      labels:
        app: sabnzbd       
    spec:
      containers:
      - name: sabnzbd      
        image: lscr.io/linuxserver/sabnzbd:latest  
        env:
          - name: PUID
            value: "100"
          - name: PGID
            value: "100"      
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: sabnzbd-data
          mountPath: /config
        - name: mnt
          mountPath: /mnt
      volumes:
      - name: sabnzbd-data
        persistentVolumeClaim:
          claimName: sabnzbd-pvc
      - name: mnt
        nfs:
            server: 192.168.0.222
            path: /Big_Lad
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: arrstack
spec:
  selector:
    app: sabnzbd
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd-ingress
  namespace: arrstack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: sab.beanieiscool.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sabnzbd
            port:
              number: 80
  tls:
  - hosts:
    - sab.beanieiscool.com
    secretName: sabnzbd-cert