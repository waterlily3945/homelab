apiVersion: v1
kind: Service
metadata:
  name: proxmox-node-exporter
  namespace: monitoring-external
  labels:
    app: proxmox
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox-node-exporter
  namespace: monitoring-external
subsets:
  - addresses:
      - ip: 192.168.0.137
    ports:
      - name: metrics
        port: 9100
