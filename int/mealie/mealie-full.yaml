apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data-pvc
  namespace: mealie
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi            
  storageClassName: longhorn  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
      - name: mealie
        image: ghcr.io/mealie-recipes/mealie:latest    # latest image per docs  [oai_citation:0‡docs.mealie.io](https://docs.mealie.io/documentation/getting-started/installation/installation-checklist/?utm_source=chatgpt.com)
        ports:
        - containerPort: 9000        # Mealie default port
        env:
          - name: ALLOW_SIGNUP
            value: "true"
          - name: BASE_URL
            value: "https://recipes.beanieiscool.com" 
          - name: TZ
            value: "America/Chicago"
        volumeMounts:
        - name: mealie-data-pvc
          mountPath: /app/data
      - name: mealie-data-pvc
        persistentVolumeClaim:
          claimName: mealie-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  selector:
    app: mealie
  ports:
  - port: 80                        
    targetPort: 9000                
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-ingress
  namespace: mealie
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod 
spec:
  ingressClassName: traefik         
  rules:
  - host: recipes.beanieiscool.com      
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mealie
            port:
              number: 80
  tls:
  - hosts:
    - recipes.beanieiscool.com
    secretName: mealie-cert
