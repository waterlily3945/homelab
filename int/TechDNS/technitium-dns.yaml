apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technitium-dns-pvc
  namespace: techdns
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-dns
  namespace: techdns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technitium-dns
  template:
    metadata:
      labels:
        app: technitium-dns
    spec:
      containers:
        - name: technitium-dns
          image: technitium/dns-server:latest
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: web
              containerPort: 5380
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /etc/dns
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: technitium-dns-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
  namespace: techdns
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: technitium-dns
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: web
      port: 5380
      targetPort: 5380
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technitium-dns
  namespace: techdns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - dns.beanieiscool.com
      secretName: technitium-dns-tls
  rules:
    - host: dns.beanieiscool.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: technitium-dns
                port:
                  number: 5380