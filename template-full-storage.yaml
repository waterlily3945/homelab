apiVersion: v1
kind: Namespace
metadata:
  name: {{NAMESPACE}}         
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{APP_NAME}}-pvc
  namespace: {{NAMESPACE}} 
spec:
  accessModes:
    - ReadWriteOnce            
  resources:
    requests:
      storage: {{STORAGE_SIZE}} 
  storageClassName: {{STORAGE_CLASS}}  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}            
  namespace: {{NAMESPACE}}      
spec:
  replicas: {{REPLICAS}}        
  selector:
    matchLabels:
      app: {{APP_NAME}}         
  template:
    metadata:
      labels:
        app: {{APP_NAME}}       
    spec:
      containers:
      - name: {{APP_NAME}}      
        image: {{IMAGE}}        
        ports:
        - containerPort: {{CONTAINER_PORT}}
        volumeMounts:
        - name: {{APP_NAME}}-data
          mountPath: {{MOUNT_PATH}}
      volumes:
      - name: {{APP_NAME}}-data
        persistentVolumeClaim:
          claimName: {{APP_NAME}}-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{APP_NAME}}
  namespace: {{NAMESPACE}}
spec:
  selector:
    app: {{APP_NAME}}
  ports:
  - port: {{SERVICE_PORT}}
    targetPort: {{CONTAINER_PORT}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{APP_NAME}}-ingress
  namespace: {{NAMESPACE}}
  annotations:
    cert-manager.io/cluster-issuer: {{CLUSTER_ISSUER}}
spec:
  ingressClassName: {{INGRESS_CLASS}}
  rules:
  - host: {{HOSTNAME}}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{APP_NAME}}
            port:
              number: {{SERVICE_PORT}}
  tls:
  - hosts:
    - {{HOSTNAME}}
    secretName: {{APP_NAME}}-cert
